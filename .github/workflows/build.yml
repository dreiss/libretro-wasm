name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  snes9x:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to create releases on tags
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build
        run: cores/snes9x/build.sh dist/snes9x
      - name: Install cc65 (for the test ROM)
        run: sudo apt-get update && sudo apt-get install -y cc65
      - name: Smoke test
        run: node test/smoke.mjs dist/snes9x
      - uses: actions/upload-artifact@v7
        with:
          name: snes9x
          path: dist/snes9x
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/snes9x/* \
            --title "$GITHUB_REF_NAME" \
            --notes "snes9x libretro core as a standalone WebAssembly module. SHA-256 sums in SHA256SUMS. snes9x's license (LICENSE.snes9x) applies to the binaries."
